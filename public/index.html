<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="description" content="DormBook — PG & Hostel Management" />
  <title>DormBook</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#6366f1"/>
          <path d="M12 36V14a2 2 0 012-2h20a2 2 0 012 2v22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="18" y="22" width="5" height="5" rx="1" fill="white"/>
          <rect x="25" y="22" width="5" height="5" rx="1" fill="white"/>
          <rect x="18" y="30" width="5" height="5" rx="1" fill="white"/>
          <rect x="25" y="30" width="5" height="5" rx="1" fill="white"/>
        </svg>
        <span>DormBook</span>
      </div>
      <div class="loading-spinner"></div>
    </div>

    <div id="login-screen" class="screen hidden">
      <div class="auth-card">
        <div class="auth-logo">
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#6366f1"/>
            <path d="M12 36V14a2 2 0 012-2h20a2 2 0 012 2v22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="18" y="22" width="5" height="5" rx="1" fill="white"/>
            <rect x="25" y="22" width="5" height="5" rx="1" fill="white"/>
            <rect x="18" y="30" width="5" height="5" rx="1" fill="white"/>
            <rect x="25" y="30" width="5" height="5" rx="1" fill="white"/>
          </svg>
          <h1>DormBook</h1>
          <p>PG Management System</p>
        </div>
        <form id="login-form" onsubmit="return false">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="owner@pg.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <div id="login-error" class="error-msg hidden"></div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-full">Sign In</button>
        </form>
      </div>
    </div>

    <div id="main-app" class="screen hidden">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" rx="12" fill="#6366f1"/>
              <path d="M12 36V14a2 2 0 012-2h20a2 2 0 012 2v22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="18" y="22" width="5" height="5" rx="1" fill="white"/>
              <rect x="25" y="22" width="5" height="5" rx="1" fill="white"/>
              <rect x="18" y="30" width="5" height="5" rx="1" fill="white"/>
              <rect x="25" y="30" width="5" height="5" rx="1" fill="white"/>
            </svg>
            <span>DormBook</span>
          </div>
          <div id="user-badge" class="user-badge"></div>
        </div>
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar-footer">
          <div id="offline-indicator" class="offline-badge hidden">📡 Offline</div>
          <button class="btn btn-ghost btn-full" id="logout-btn">Sign Out</button>
        </div>
      </nav>

      <main class="content" id="content">
        <div class="page-header">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h2 id="page-title">Dashboard</h2>
          <div class="header-actions" id="header-actions"></div>
        </div>
        <div id="page-content" class="page-content"></div>
      </main>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
</body>
</html>
